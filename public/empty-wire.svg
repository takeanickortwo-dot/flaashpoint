<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none">
  <!-- ground line with survey ticks -->
  <g stroke="#3B4136" stroke-width="1">
    <line x1="40" y1="320" x2="440" y2="320" />
    <line x1="80" y1="320" x2="80" y2="326" />
    <line x1="160" y1="320" x2="160" y2="326" />
    <line x1="240" y1="320" x2="240" y2="326" />
    <line x1="320" y1="320" x2="320" y2="326" />
    <line x1="400" y1="320" x2="400" y2="326" />
  </g>

  <!-- tripod -->
  <g stroke="#FFB000" stroke-width="1.5" stroke-linecap="round">
    <line x1="240" y1="225" x2="168" y2="320" />
    <line x1="240" y1="225" x2="312" y2="320" />
    <line x1="240" y1="225" x2="240" y2="320" />
  </g>
  <g stroke="#3B4136" stroke-width="1.5" stroke-linecap="round">
    <line x1="160" y1="320" x2="176" y2="320" />
    <line x1="232" y1="320" x2="248" y2="320" />
    <line x1="304" y1="320" x2="320" y2="320" />
  </g>

  <!-- mast + hub -->
  <line x1="240" y1="225" x2="240" y2="168" stroke="#FFB000" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="240" cy="225" r="4" stroke="#FFB000" stroke-width="1.5" />

  <!-- dish (tilted parabola, edge-on) -->
  <g transform="rotate(-35 258 132)">
    <ellipse cx="258" cy="132" rx="64" ry="20" stroke="#FFB000" stroke-width="1.5" />
    <ellipse cx="258" cy="132" rx="48" ry="13" stroke="#3B4136" stroke-width="1" />
  </g>
  <!-- feed arm + horn -->
  <line x1="246" y1="146" x2="318" y2="82" stroke="#FFB000" stroke-width="1.5" stroke-linecap="round" />
  <rect x="314" y="74" width="8" height="8" stroke="#FFB000" stroke-width="1.5" transform="rotate(15 318 78)" />

  <!-- radiating signal arcs, dashed, fading out -->
  <g fill="none" stroke="#FFB000" stroke-linecap="round" stroke-dasharray="6 7">
    <path d="M 352 74 A 38 38 0 0 1 338 44" stroke-width="1.5" opacity="0.6" />
    <path d="M 372 80 A 62 62 0 0 1 348 26" stroke-width="1.5" opacity="0.35" />
    <path d="M 392 86 A 86 86 0 0 1 358 8" stroke-width="1.5" opacity="0.18" />
  </g>

  <!-- coordinate crosses -->
  <g stroke="#3B4136" stroke-width="1">
    <path d="M 96 84 h 12 M 102 78 v 12" />
    <path d="M 380 236 h 12 M 386 230 v 12" />
    <path d="M 72 208 h 12 M 78 202 v 12" />
  </g>

  <!-- caption -->
  <text x="240" y="350" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="4" fill="#FFB000">AWAITING TRANSMISSION</text>
</svg>
